<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Safira ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bg-grid { background-size: 20px 20px; background-image: radial-gradient(circle, #e2e8f0 1px, transparent 1px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen bg-grid flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-600 flex justify-center items-center gap-2">
                    <i data-lucide="layers" class="w-8 h-8"></i>
                    Safira <span class="text-slate-400 font-light">ERP</span>
                </h1>
                <p class="text-slate-500 text-sm mt-2">Acesse sua conta para gerenciar seu autocenter</p>
            </div>

            <form method="post" class="space-y-6">
                {% csrf_token %}

                {% if form.errors %}
                <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
                    E-mail ou senha incorretos.
                </div>
                {% endif %}

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </span>
                        <input type="email" name="username" required
                            class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none"
                            placeholder="seu@email.com">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </span>
                        <input type="password" name="password" required
                            class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-200">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Entrar
                </button>
            </form>
        </div>

        <p class="text-center text-slate-400 text-xs mt-8">
            &copy; 2024 Safira Softwares. Todos os direitos reservados.
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
